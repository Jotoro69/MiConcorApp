name: Build APK with Buildozer
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4
       - name: Set up Python
         uses: actions/setup-python@v5
         with:
            python-version: "3.10"
       - name: Install dependencies
         run: |
           sudo apt update
           sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev aidl
           pip install --upgrade pip setuptools buildozer cython
       - name: Build APK with Buildozer
         run: |
           mkdir -p ~/.android
           touch ~/.android/repositories.cfg
           export BUILDOZER_ACCEPT_SDK_LICENSES=1
           yes | buildozer -v android debug || yes | buildozer -v android debug
       - name: Upload APK artifact
         uses: actions/upload-artifact@v4
         with:
           name: package-apk
           path: bin/*.apk
